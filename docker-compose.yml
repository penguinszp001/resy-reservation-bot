services:
  resy-bot:
    build: .
    container_name: resy-reservation-bot
    stdin_open: true
    tty: true
    environment:
      TARGET_RESERVATION_TIME: ${TARGET_RESERVATION_TIME}
      TARGET_RUN_TIME: ${TARGET_RUN_TIME}
      RELOAD_INTERVAL: ${RELOAD_INTERVAL}
      URL: ${URL}
      LOGIN_WAIT_SECONDS: ${LOGIN_WAIT_SECONDS:-0}
      RESY_HEADLESS: ${RESY_HEADLESS:-true}
      RESY_LOGIN_EMAIL: ${RESY_LOGIN_EMAIL:-}
      RESY_LOGIN_PASSWORD: ${RESY_LOGIN_PASSWORD:-}
      RESY_LOGIN_TIMEOUT_MS: ${RESY_LOGIN_TIMEOUT_MS:-15000}
      DISPLAY: ${DISPLAY}
    volumes:
      - ./logging:/app/logging
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
    ipc: host
    user: root
